const PAGES = [

const LEGACY = { top:'home', people:'team' };

function readRoute(){
  try {
    let h = (window.location.hash || '').replace(/^#\/?/, '').toLowerCase();
    h = LEGACY[h] || h;
    return PAGE_IDS.includes(h) ? h : 'home';
  } catch(e){ return 'home'; }
}

const RouteCtx = React.createContext({ page:'home', go:()=>{} });

function useRouter(){
  const [page, setPage] = useState(readRoute);
  useEffect(()=>{
    const h = ()=> setPage(readRoute());
    window.addEventListener('hashchange', h);
    window.addEventListener('popstate', h);
    return ()=>{ window.removeEventListener('hashchange', h); window.removeEventListener('popstate', h); };
  },[]);
  useEffect(()=>{
    const label = (PAGES.find(p=>p[0]===page) || PAGES[0])[1];
    document.title = (page==='home' ? '' : label + ' — ') + 'CHILab — Computational Health Informatics Laboratory';
  },[page]);
  const go = (id)=>{
    setPage(id);
    try { window.history.pushState(null, '', '#/' + id); } catch(e){}
    window.scrollTo(0, 0);
  };
  return { page, go };
}

function PageLink({ to, children, ...rest }){
  const { go } = React.useContext(RouteCtx);
  return (
    <a href={'#/' + to} onClick={e=>{
      if(e.metaKey || e.ctrlKey || e.shiftKey || e.button===1) return;
      e.preventDefault(); go(to);
    }} {...rest}>{children}</a>
  );
}

// Dot field: each dot is a record; size and color follow a signal that rises
// across the field, with three marked points on top.
function HomeGraphic(){
  const COLS = 19, ROWS = 19, STEP = 18, PAD = 14;
  const W = PAD*2 + STEP*(COLS-1), H = PAD*2 + STEP*(ROWS-1);
  const X = c => PAD + c*STEP, Y = r => PAD + r*STEP;
  // deterministic pseudo-random in [0,1)
  const rnd = (a,b) => { const t = Math.sin(a*127.1 + b*311.7) * 43758.5453; return t - Math.floor(t); };
  // ridge: rises from bottom-left to top-right with a gentle wave
  const ridge = c => (ROWS-3.5) - (ROWS-7) * (c/(COLS-1)) + 1.6*Math.sin(c/(COLS-1) * Math.PI * 2.2);
  const dots = [];
  for(let r=0; r<ROWS; r++) for(let c=0; c<COLS; c++){
    const d = Math.abs(r - ridge(c));
    const n = rnd(c, r);
    const width = 1.5 + 2.6 * (0.5 + 0.5*Math.sin(c/(COLS-1) * Math.PI * 1.6 + 0.4));
    const v = Math.exp(-Math.pow(d/width, 2)) * (0.78 + 0.22*n);
    const fill = v > 0.62 ? 'var(--accent)' : v > 0.3 ? 'var(--accent-soft)' : v > 0.1 ? '#A9CFCB' : '#C9D2D2';
    dots.push(<circle key={r+'-'+c} cx={X(c)} cy={Y(r)} r={1.1 + 0.9*n + 4.4*v} fill={fill} opacity={v > 0.1 ? 1 : 0.45 + 0.55*n}/>);
  }
  const marks = [3, 10, 16].map((c,i)=>{
    const x = X(c), y = Y(Math.round(ridge(c)));
    return (
      <g key={'m'+i}>
        <circle cx={x} cy={y} r={11} fill="none" stroke="var(--accent-2)" strokeWidth="1.2"/>
        <circle cx={x} cy={y} r={3.6} fill="var(--accent-2)"/>
      </g>
    );
  });
  return (
    <svg className="home-graphic" viewBox={`0 0 ${W} ${H}`} aria-hidden="true">{dots}{marks}</svg>
  );
}

// Logo mark: a small cut of the same dot field.
function LogoMark({ size = 28 }){
  const N = 5, STEP = 5, PAD = 2;
  const dots = [];
  for(let r=0; r<N; r++) for(let c=0; c<N; c++){
    const d = Math.abs(r - (N-1-c));
    const mark = d === 0 && c === 3;
    dots.push(
      <circle key={r+'-'+c} cx={PAD + c*STEP} cy={PAD + r*STEP}
        r={d === 0 ? 2.1 : d === 1 ? 1.4 : 0.8}
        fill={mark ? 'var(--accent-2)' : d === 0 ? 'var(--accent)' : d === 1 ? 'var(--accent-soft)' : '#B4C0C0'}/>
    );
  }
  return <svg width={size} height={size} viewBox="0 0 24 24" aria-hidden="true">{dots}</svg>;
}

// A member's links: Google Scholar (`link`) first, then ORCID (`orcid`).
function memberLinks(p){
  const out = [];
  if(p.link) out.push(['Google Scholar', p.link]);
  if(p.orcid) out.push(['ORCID', 'https://orcid.org/' + p.orcid]);
  return out;
}

function Publications(){
  const [year, setYear] = useState('all');
  const [tag, setTag] = useState('all');
  const [q, setQ] = useState('');
  const [pubs, setPubs] = useState([]);
  const [meta, setMeta] = useState({ updated_at: null, source: null });
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    fetch('data/publications.json')
      .then(r => r.json())
      .then(data => {
        const MIN_YEAR = 2020;
        const items = (data.items || []).filter(p => Number(p.year) >= MIN_YEAR);
        setPubs(items);
        setMeta({ updated_at: data.updated_at, source: data.source });
        setLoading(false);
      })
      .catch(err => {
        console.error('Failed to load publications.json', err);
        setLoading(false);
      });
  }, []);

  const years = ['all', ...Array.from(new Set(pubs.map(p=>p.year))).sort((a,b)=>b-a)];
  const tags = ['all', ...Array.from(new Set(pubs.map(p=>p.tag).filter(Boolean)))];

  const filtered = useMemo(()=>{
    return pubs.filter(p=>{
      if(year!=='all' && p.year!==year) return false;
      if(tag!=='all' && p.tag!==tag) return false;
      if(q && !(p.title.toLowerCase().includes(q.toLowerCase()) || (p.authors||'').toLowerCase().includes(q.toLowerCase()))) return false;
      return true;
    });
  }, [pubs, year, tag, q]);

  const grouped = useMemo(()=>{
    const g = {};
    filtered.forEach(p=>{ (g[p.year] = g[p.year] || []).push(p); });
    return g;
  }, [filtered]);

  return (
    <section id="publications" style={{padding:'140px 0 120px', flex:1}}>
      <div className="container">
        <PageHead
          kicker={meta.source === 'google_scholar' ? 'Auto-synced · Google Scholar' : 'Selected · since 2020'}
          right={meta.updated_at && <>LAST SYNC <span style={{color:'var(--accent)'}}>●</span> {meta.updated_at}</>}
        />

        <PageTitle>Publications</PageTitle>

        <div className="pub-controls" style={{marginTop:40, marginBottom:60}}>
          <div className="grid-2" style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:20}}>
            <div>
              <div className="mono" style={{fontSize:10, color:'var(--muted)', marginBottom:10}}>YEAR</div>
              <div style={{display:'flex', flexWrap:'wrap', gap:6}}>
                {years.map(y=>(
                  <button key={y} onClick={()=>setYear(y)} className="mono" style={{
                    fontSize:11, padding:'5px 10px',
                    border: year===y ? '1px solid var(--accent)' : '1px solid var(--line)',
                    borderRadius: 2,
                    background: year===y ? 'var(--accent)':'transparent',
                    color: year===y ? 'var(--paper)':'var(--ink)'
                  }}>{y==='all'?'ALL':y}</button>
                ))}
              </div>
            </div>
            <div>
              <label htmlFor="pub-search" className="mono" style={{display:'block', fontSize:10, color:'var(--muted)', marginBottom:10}}>SEARCH</label>
              <input id="pub-search" value={q} onChange={e=>setQ(e.target.value)} placeholder="title, author…"
                style={{width:'100%', border:'none', borderBottom:'1px solid var(--muted)', background:'transparent', padding:'6px 0', fontSize:13, outline:'none'}}/>
            </div>
          </div>
        </div>

        {loading && (
          <div style={{padding:'80px 0', textAlign:'center', color:'var(--muted)'}} className="mono">
            <span style={{fontSize:11}}>LOADING PUBLICATIONS…</span>
          </div>
        )}

        {!loading && Object.keys(grouped).length===0 && (
          <div style={{padding:'80px 0', textAlign:'center', color:'var(--muted)'}}>No matching publications.</div>
        )}

        {Object.keys(grouped).sort((a,b)=>b-a).map(y=>(
          <div key={y} style={{marginBottom:40}}>
            <div style={{display:'flex', alignItems:'baseline', gap:32, marginBottom:20, paddingBottom:16, borderBottom:'2px solid var(--accent)'}}>
              <span className="serif" style={{fontSize:44, letterSpacing:'-0.03em', lineHeight:0.9, fontWeight:500}}>{y}</span>
            </div>
            {grouped[y].map((p, i)=>(
              <article key={i} className="pub-row" style={{
                display:'grid', gridTemplateColumns:'60px 1fr 180px',
                gap:32, padding:'20px 0',
                borderBottom:'1px solid var(--line)',
                alignItems:'start'
              }}>
                <div className="mono" style={{fontSize:11, color:'var(--muted)'}}>
                  {String(i+1).padStart(2,'0')}
                </div>
                <div>
                  <div className="serif" style={{fontSize:22, lineHeight:1.25, letterSpacing:'-0.01em', marginBottom:7, textWrap:'pretty'}}>
                    {p.link ? (
                      <a href={p.link} target="_blank" rel="noopener" style={{borderBottom:'1px solid transparent', transition:'border-color 0.2s'}}
                         onMouseEnter={e=>e.currentTarget.style.borderBottomColor='var(--accent)'}
                         onMouseLeave={e=>e.currentTarget.style.borderBottomColor='transparent'}>
                        {p.title}
                      </a>
                    ) : p.title}
                  </div>
                  <div style={{fontSize:13, color:'var(--muted)', marginBottom:7, lineHeight:1.5}}>{p.authors}</div>
                  <div style={{display:'flex', gap:12, alignItems:'center'}}>
                    <span style={{fontSize:13}} className="serif">{p.venue}</span>
                  </div>
                </div>
                <div className="pub-actions" style={{display:'flex', flexDirection:'column', gap:6, alignItems:'flex-end'}}>
                  <button className="mono" style={{fontSize:10, color:'var(--muted)'}} onClick={()=>{
                    navigator.clipboard?.writeText(`@article{${(p.authors||'ref').split(',')[0].split(' ').pop().toLowerCase()}${p.year},\n  title={${p.title}},\n  author={${p.authors||''}},\n  journal={${p.venue||''}},\n  year={${p.year}}\n}`);
                  }}>COPY BIBTEX ⎘</button>
                  {p.link ? (
                    <a href={p.link} target="_blank" rel="noopener" className="mono" style={{fontSize:10, color:'var(--accent)'}}>READ →</a>
                  ) : (
                    <span className="mono" style={{fontSize:10, color:'var(--muted)', opacity:0.4}}>READ →</span>
                  )}
                </div>
              </article>
            ))}
          </div>
        ))}
      </div>
    </section>
  );
}

// ---------- Conferences ----------
// data/conferences.json is rebuilt weekly by scripts/update_conferences.py.
const CONF_AREAS = [
  ['AI', ['ML','NLP','CV','Bio','Robot']],
  ['CS', ['Alg','Arch','CGI','DB','DM','HPC','Net','OS','PL','SE','Sec']],
];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const ymd = iso => iso.split('-').map(Number);
function fmtRange(start, end){
  const [y1,m1,d1] = ymd(start), [y2,m2,d2] = ymd(end || start);
  const mon = m => MONTH_NAMES[m-1].slice(0,3);
  if(y1!==y2) return `${mon(m1)} ${d1}, ${y1} – ${mon(m2)} ${d2}, ${y2}`;
  if(m1!==m2) return `${mon(m1)} ${d1} – ${mon(m2)} ${d2}, ${y2}`;
  if(d1===d2) return `${mon(m1)} ${d1}, ${y1}`;
  return `${mon(m1)} ${d1}–${d2}, ${y1}`;
}

function ConfRow({ c }){
  const n = c.next, a = c.announced || {};
  const link = (n && n.link) || a.link || (c.last && c.last.link) || '';
  const place = n ? n.place : a.place;
  const note = n ? n.note : a.note;
  return (
    <div className="conf-row" style={{padding:'18px 0', borderBottom:'1px solid var(--line)'}}>
      <div className="mono" style={{fontSize:12, color: n ? 'var(--ink)' : 'var(--muted)', paddingTop:5}}>
        {n ? fmtRange(n.start, n.end) : (a.year ? `${a.year} · dates TBA` : 'TBA')}
      </div>
      <div>
        <div className="serif" style={{fontSize:20, letterSpacing:'-0.01em', lineHeight:1.25}}>
          {link
            ? <a className="press-link" href={link} target="_blank" rel="noopener noreferrer" aria-label={`${c.acronym} — conference website (opens in a new tab)`}>{c.acronym}</a>
            : c.acronym}
        </div>
        <div style={{fontSize:12.5, color:'var(--muted)', marginTop:3, lineHeight:1.45}}>{c.name}</div>
        {note && <div style={{fontSize:12, color:'var(--accent)', marginTop:4}}>{note}</div>}
      </div>
      <div style={{fontSize:13.5, lineHeight:1.45, paddingTop:4}}>
        {place || <span style={{color:'var(--muted)'}}>{n ? 'Place TBA' : '—'}</span>}
        {!n && c.last && (
          <div style={{fontSize:12, color:'var(--muted)', marginTop:3}}>
            Last held {fmtRange(c.last.start, c.last.end)}{c.last.place ? ` · ${c.last.place}` : ''}
          </div>
        )}
      </div>
      <div className="mono conf-tags" style={{fontSize:10, display:'flex', gap:8, alignItems:'center', justifyContent:'flex-end', paddingTop:6}}>
        <span style={{color:'var(--muted)'}}>{c.area}</span>
      </div>
    </div>
  );
}

function Conferences(){
  const [items, setItems] = useState([]);
  const [updated, setUpdated] = useState(null);
  const [state, setState] = useState('loading');
  const [area, setArea] = useState('all');
  const [q, setQ] = useState('');

  useEffect(()=>{
    fetch('data/conferences.json')
      .then(r=>r.json())
      .then(d=>{ setItems(d.items || []); setUpdated(d.updated_at); setState('ready'); })
      .catch(err=>{ console.error('Failed to load conferences.json', err); setState('error'); });
  },[]);

  const filtered = useMemo(()=>{
    const needle = q.trim().toLowerCase();
    return items.filter(c=>{
      if(area!=='all' && c.area!==area && c.field!==area) return false;
      if(needle){
        const hay = [c.acronym, c.name, c.next && c.next.place, c.announced && c.announced.place].filter(Boolean).join(' ').toLowerCase();
        if(!hay.includes(needle)) return false;
      }
      return true;
    });
  }, [items, area, q]);

  const groups = useMemo(()=>{
    const dated = filtered.filter(c=>c.next).sort((a,b)=> a.next.start.localeCompare(b.next.start) || a.acronym.localeCompare(b.acronym));
    const tba = filtered.filter(c=>!c.next).sort((a,b)=> a.acronym.localeCompare(b.acronym, undefined, {sensitivity:'base'}));
    const out = [];
    dated.forEach(c=>{
      const [y,m] = ymd(c.next.start);
      const label = `${MONTH_NAMES[m-1]} ${y}`;
      if(!out.length || out[out.length-1].label!==label) out.push({ label, rows: [] });
      out[out.length-1].rows.push(c);
    });
    if(tba.length) out.push({ label: 'To be announced', rows: tba });
    return out;
  }, [filtered]);

  return (
    <section id="conferences" style={{padding:'140px 0 120px', flex:1}}>
      <div className="container">
        <PageHead kicker="Next editions · KIISE 2024 top conference list"
                  right={updated && <>UPDATED <span style={{color:'var(--accent)'}}>●</span> {updated}</>}/>
        <PageTitle>Conferences</PageTitle>

        <div className="conf-controls" style={{marginTop:40, marginBottom:20}}>
          <div>
            <label htmlFor="conf-area" className="mono" style={{display:'block', fontSize:10, color:'var(--muted)', marginBottom:10}}>FIELD</label>
            <select id="conf-area" value={area} onChange={e=>setArea(e.target.value)} className="mono" style={{
              width:'100%', border:'none', borderBottom:'1px solid var(--muted)', background:'transparent',
              padding:'6px 0', fontSize:13, color:'var(--ink)', outline:'none', borderRadius:0
            }}>
              <option value="all">All fields</option>
              {CONF_AREAS.map(([f, areas])=>(
                <optgroup key={f} label={f}>
                  <option value={f}>All {f}</option>
                  {areas.map(a=><option key={a} value={a}>{a}</option>)}
                </optgroup>
              ))}
            </select>
          </div>
          <div>
            <label htmlFor="conf-search" className="mono" style={{display:'block', fontSize:10, color:'var(--muted)', marginBottom:10}}>SEARCH</label>
            <input id="conf-search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Acronym, name or place"
              style={{width:'100%', border:'none', borderBottom:'1px solid var(--muted)', background:'transparent', padding:'6px 0', fontSize:15, outline:'none', fontFamily:'inherit'}}/>
          </div>
        </div>

        <p style={{fontSize:12.5, color:'var(--muted)', lineHeight:1.6, marginBottom:28, maxWidth:'90ch'}}>
          {state==='ready' && <>{filtered.length} of {items.length} conferences · </>}
          Dates are the main conference days; workshops and tutorials may fall outside them.
          Always confirm on the conference website.
        </p>

        {state==='loading' && <div className="mono" style={{fontSize:12, color:'var(--muted)', padding:'40px 0'}}>Loading…</div>}
        {state==='error' && <div style={{padding:'40px 0', color:'var(--muted)'}}>The conference list could not be loaded. Please try again later.</div>}
        {state==='ready' && groups.length===0 && (
          <div style={{padding:'60px 0', textAlign:'center', color:'var(--muted)'}} className="serif">No conferences match this filter.</div>
        )}

        {groups.map(g=>(
          <div key={g.label} style={{marginBottom:44}}>
            <h2 className="serif" style={{fontSize:28, letterSpacing:'-0.02em', lineHeight:1, fontWeight:500, paddingBottom:14, borderBottom:'2px solid var(--accent)'}}>{g.label}</h2>
            {g.rows.map(c=> <ConfRow key={c.acronym + c.tier} c={c}/>)}
          </div>
        ))}
      </div>
    </section>
  );
}
